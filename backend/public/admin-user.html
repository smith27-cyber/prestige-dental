<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body>
    <div class="sidebar">
        <h2>Admin Dashboard</h2>
        <ul>
            <li><a href="admin-dashboard.html">Dashboard</a></li>
            <li><a href="admin-booking.html">Bookings</a></li>
            <li><a href="admin-user.html">Users</a></li>
            <li><a href="#reports">Reports</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="public-testimonial.html">Manage Testimonials</a></li>
        </ul>
    </div>
    
    <div class="main-content">
        <section id="users">
            <h1>Manage Users</h1>

            <!-- Status Message Element -->
            <div id="status-message" class="status-message"></div>

            <form id="user-form">
                <label for="user-name">Username:</label>
                <input type="text" id="user-name" name="username" required>

                <label for="user-email">Email:</label>
                <input type="email" id="user-email" name="email" required>

                <label for="user-role">Role:</label>
                <select id="user-role" name="role" required>
                    <option value="">Select a role</option>
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                </select>

                <label for="user-password">Password:</label>
                <input type="password" id="user-password" name="password" required>

                <button type="submit">Add User</button>
            </form>

            <h2>Users List</h2>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>Select</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Users will be dynamically added here -->
                </tbody>
            </table>

            <form id="bulk-edit-form">
                <h3>Bulk Edit</h3>
                <label for="bulk-role">New Role:</label>
                <select id="bulk-role" name="bulk-role">
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                </select>
                <button type="submit">Apply Changes</button>
            </form>
        </section>
    </div>

    <script src="js/users-script.js"></script>
</body>
</html>
