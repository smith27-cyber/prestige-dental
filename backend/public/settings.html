<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="settings-container">
        <h1>Admin Settings</h1>
        <form id="settings-form">
            <label for="app-name">Application Name:</label>
            <input type="text" id="app-name" name="app_name" required>

            <label for="contact-email">Contact Email:</label>
            <input type="email" id="contact-email" name="contact_email" required>

            <label for="business-hours">Business Hours:</label>
            <input type="text" id="business-hours" name="business_hours">

            <button type="submit">Save Settings</button>
        </form>
    </div>

    <div class="appointment-settings">
        <h2>Appointment Settings</h2>
        <form id="appointment-settings-form">
            <label for="appointment-time-slots">Time Slots (comma-separated):</label>
            <input type="text" id="appointment-time-slots" name="appointment_time_slots" required>
    
            <label for="cancellation-policy">Cancellation Policy:</label>
            <textarea id="cancellation-policy" name="cancellation_policy"></textarea>
    
            <button type="submit">Save Settings</button>
        </form>
    </div>

    <script src="/js/settings.js"></script>
</body>
</html>
